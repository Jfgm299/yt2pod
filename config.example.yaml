# yt2pod configuration. Copy to config.yaml and edit.

# Where audio, feeds and the database are stored (relative to this file).
data_dir: ./data

# How often `yt2pod run` re-checks every source: 30m, 1h, 6h...
check_interval: 1h

# Optional: cookies.txt exported from your browser, for members-only or age-restricted videos.
# cookies_file: ./cookies.txt

server:
  host: 0.0.0.0
  port: 8080
  # Public URL your podcast app will use. Must be reachable from your phone
  # (LAN IP, Tailscale name, or a domain behind a reverse proxy).
  base_url: http://192.168.1.50:8080

# Applied to every feed; each feed can override any of these.
defaults:
  audio_format: best     # best: YouTube's best stream untouched (Opus/AAC, max quality)
                         # m4a: AAC copy, best for iPhone · mp3: re-encoded, most compatible
  scan_limit: 30         # how many of the newest videos to look at on each check
  backfill: 3            # on the very first sync, download only the N newest matching videos
  max_episodes: 50       # keep at most N episodes per feed (oldest files are deleted); omit for unlimited
  filters:
    exclude_shorts: true
    exclude_live: true   # skip live streams and premieres that haven't aired yet

feeds:
  # A whole channel, keeping only long videos (drops clips, trailers, shorts).
  - id: full-episodes
    source: "@SomeChannel"            # @handle, channel URL, or channel ID (UC...)
    title: Some Channel (full episodes only)
    filters:
      min_duration: 40m               # 90s, 20m, 1h30m, 1:15:00 all work
      title_exclude:                  # regex, case-insensitive
        - "\\bclip\\b"
        - "highlights?"
        - "#shorts"

  # A specific playlist (e.g. the channel's "Full Episodes" playlist).
  - id: my-playlist
    source: https://www.youtube.com/playlist?list=PLxxxxxxxxxxxxxxxx
    backfill: 10
    audio_format: mp3
    sponsorblock_remove: [sponsor, selfpromo, intro, outro]   # cut segments using SponsorBlock
    filters:
      min_duration: 10m
      max_duration: 4h
      title_include: ["Episode \\d+", "^#\\d+"]               # keep only if the title matches one of these
      published_after: 2025-01-01
