[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2pod"
version = "0.1.0"
description = "Turn YouTube channels and playlists into self-hosted podcast feeds, with per-feed filters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2024.10.22", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yt2pod = "yt2pod.cli:main"

[tool.setuptools]
packages = ["yt2pod"]

[tool.setuptools.package-data]
yt2pod = ["ui.html"]
