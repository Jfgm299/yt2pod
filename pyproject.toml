[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2pod"
version = "0.5.3"
description = "Follow YouTube channels and listen to them as podcasts: a self-hosted PWA with synced progress."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
yt2pod = "yt2pod.cli:main"

[tool.setuptools]
packages = ["yt2pod"]

[tool.setuptools.package-data]
yt2pod = ["web/*", "web/**/*"]
