<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt2pod</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #c4302b; --accent-text: #ffffff; --ok: #1f7a3d; --ok-bg: #e5f4ea; --no: #8a5a00; --no-bg: #fbf0d9;
    --err: #b42318; --err-bg: #fde8e6; --chip: #efeeea; --bar: #c4302b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ecebe6; --muted: #9b9a94; --line: #34332f;
      --accent: #e5534b; --accent-text: #ffffff; --ok: #6fcf8f; --ok-bg: #1d3325; --no: #e5b65c; --no-bg: #3a2f17;
      --err: #ff8a80; --err-bg: #3d1f1c; --chip: #2a2a27; --bar: #e5534b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { max-width: 980px; margin: 0 auto; padding: 24px 16px 8px; display: flex; align-items: baseline;
           gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent); }
  header .env { color: var(--muted); font-size: 13px; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 16px 64px; display: grid; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  section h2 { margin: 0 0 12px; font-size: 16px; display: flex; gap: 10px; align-items: center; }
  section h2 .n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
                  background: var(--accent); color: var(--accent-text); font-size: 13px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 14px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 64px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; }
  button { font: inherit; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line);
           background: var(--card); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .spacer { flex: 1; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .videos { display: grid; gap: 2px; margin-top: 8px; }
  .video { display: grid; grid-template-columns: 24px 96px 1fr auto; gap: 12px; align-items: center;
           padding: 8px; border-radius: 8px; }
  .video:hover { background: var(--bg); }
  .video img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; background: var(--chip); }
  .video .t { font-weight: 500; overflow-wrap: anywhere; }
  .video .t a { color: inherit; text-decoration: none; }
  .video .t a:hover { text-decoration: underline; }
  .video .meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .video.rejected { opacity: .55; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.no { background: var(--no-bg); color: var(--no); }
  .badge.have { background: var(--chip); color: var(--muted); }
  .formats { display: grid; gap: 8px; }
  .format { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 10px 12px; border: 1px solid var(--line);
            border-radius: 8px; cursor: pointer; }
  .format:has(input:checked) { border-color: var(--accent); }
  .format b { font-weight: 600; }
  .format span { color: var(--muted); font-size: 13px; }
  .job { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 6px; }
  .job:first-child { border-top: 0; }
  .job .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .job .head .t { font-weight: 500; flex: 1; min-width: 200px; }
  .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--bar); transition: width .3s; }
  .quality { font-size: 13px; color: var(--muted); }
  .quality b { color: var(--text); font-weight: 600; }
  audio { width: 100%; height: 36px; }
  code { background: var(--chip); padding: 2px 6px; border-radius: 4px; font-size: 13px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 14px; }
  @media (max-width: 600px) {
    .video { grid-template-columns: 24px 1fr; }
    .video img { display: none; }
    .video .badges { grid-column: 2; }
  }
</style>
</head>
<body>
<header>
  <h1>yt2<span>pod</span></h1>
  <div class="env" id="env">cargando…</div>
</header>
<main>
  <section>
    <h2><span class="n">1</span>Canal o lista de reproducción</h2>
    <div class="grid">
      <label style="grid-column: 1 / -1"><span>Canal (@handle o URL) o URL de una lista de reproducción</span>
        <input type="text" id="source" placeholder="@lexfridman  ·  https://www.youtube.com/playlist?list=PL…" autocomplete="off">
      </label>
      <label>Nombre del feed <input type="text" id="feed_id" placeholder="lexfridman"></label>
      <label>Título (opcional) <input type="text" id="title" placeholder="Usa el nombre del canal"></label>
      <label id="presetWrap" hidden>Cargar un feed guardado <select id="preset"><option value="">—</option></select></label>
    </div>
  </section>

  <section>
    <h2><span class="n">2</span>Filtros</h2>
    <div class="grid">
      <label>Duración mínima <input type="text" id="min_duration" placeholder="p. ej. 20m, 1h"></label>
      <label>Duración máxima <input type="text" id="max_duration" placeholder="sin límite"></label>
      <label>Publicado después de <input type="date" id="published_after"></label>
      <label>Vídeos a revisar <input type="number" id="limit" value="30" min="1" max="500"></label>
      <label>El título debe contener <textarea id="title_include" placeholder="una regex por línea&#10;p. ej. ^#\d+"></textarea>
        <span class="hint">Vacío = cualquiera.</span></label>
      <label>Descartar si el título contiene <textarea id="title_exclude" placeholder="clip&#10;highlights&#10;#shorts"></textarea>
        <span class="hint">Sin distinguir mayúsculas.</span></label>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="exclude_shorts" checked> Excluir Shorts</label>
      <label class="check"><input type="checkbox" id="exclude_live" checked> Excluir directos y estrenos</label>
      <label class="check"><input type="checkbox" id="full"> Leer fechas exactas (más lento)</label>
      <span class="spacer"></span>
      <button class="primary" id="searchBtn">Buscar vídeos</button>
    </div>
    <div id="searchMsg"></div>
  </section>

  <section id="resultsSec" hidden>
    <h2><span class="n">3</span><span id="resultsTitle">Vídeos</span></h2>
    <div class="row" style="margin-top:0">
      <span id="summary" class="hint"></span>
      <span class="spacer"></span>
      <label class="check"><input type="checkbox" id="showRejected"> Mostrar descartados</label>
      <button id="selAll">Seleccionar los que pasan</button>
      <button id="selNone">Ninguno</button>
    </div>
    <div class="videos" id="videos"></div>
  </section>

  <section id="audioSec" hidden>
    <h2><span class="n">4</span>Audio</h2>
    <div class="formats">
      <label class="format"><input type="radio" name="fmt" value="best" checked>
        <div><b>Original, máxima calidad</b> (recomendado)<br>
        <span>El mejor stream de audio de YouTube tal cual, sin recodificar: normalmente Opus ~160 kbps (.opus), si no AAC (.m4a). Funciona en Android (AntennaPod, Pocket Casts), VLC y navegadores; Apple Podcasts puede no reproducir .opus.</span></div></label>
      <label class="format"><input type="radio" name="fmt" value="m4a">
        <div><b>AAC (.m4a)</b>, compatible con todo<br>
        <span>El stream AAC 128 kbps de YouTube copiado sin recodificar. La mejor opción para iPhone / Apple Podcasts.</span></div></label>
      <label class="format"><input type="radio" name="fmt" value="mp3">
        <div><b>MP3</b> (VBR ~245 kbps)<br>
        <span>Se recodifica desde el original: más compatible con reproductores antiguos, pero pierde algo de calidad.</span></div></label>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="sponsorblock"> Recortar patrocinios, autopromoción e intros con SponsorBlock</label>
      <span class="spacer"></span>
      <button class="primary" id="downloadBtn" disabled>Preparar audio</button>
    </div>
  </section>

  <section id="jobsSec" hidden>
    <h2><span class="n">5</span>Tu podcast</h2>
    <div id="jobs"></div>
    <div id="feedBox" hidden>
      <p style="margin:12px 0 4px">URL del feed para tu app de podcasts (en este ordenador):</p>
      <code id="feedUrl"></code>
    </div>
    <div class="row">
      <span class="hint" id="saveHint"></span>
      <span class="spacer"></span>
      <button id="saveBtn">Guardar como feed vigilado en config.yaml</button>
    </div>
    <div id="saveMsg"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let state = null, videos = [], selected = new Set(), feedIdTouched = false, polling = null;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function lines(id) { return $(id).value.split("\n").map(s => s.trim()).filter(Boolean); }
function showMsg(el, text, kind = "err") { $(el).innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ""; }

const REASONS = [[/^short \(<= 60s\)$/, "Short (≤ 1 min)"], [/^short$/, "Short"], [/^live\/upcoming$/, "directo o estreno"],
  [/^too short/, "demasiado corto"], [/^too long/, "demasiado largo"],
  [/^title does not match title_include$/, "el título no contiene lo requerido"],
  [/^title matches exclude pattern/, "título descartado por"], [/^description matches exclude pattern/, "descripción descartada por"],
  [/^published before/, "publicado antes del"]];
function reasonEs(r) { for (const [re, es] of REASONS) if (re.test(r)) return r.replace(re, es); return r; }

function suggestFeedId(src) {
  src = src.trim();
  let m = src.match(/@([\w.-]+)/);
  if (m) return m[1].toLowerCase().replace(/[^a-z0-9_-]/g, "");
  m = src.match(/list=([\w-]+)/);
  if (m) return ("playlist-" + m[1].slice(-8)).toLowerCase().replace(/[^a-z0-9_-]/g, "");
  m = src.match(/(?:channel|c|user)\/([\w-]+)/);
  if (m) return m[1].toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 24);
  return "";
}

function request() {
  return {
    source: $("source").value, feed_id: $("feed_id").value || suggestFeedId($("source").value),
    title: $("title").value, limit: Number($("limit").value) || 30, full: $("full").checked,
    audio_format: document.querySelector("input[name=fmt]:checked").value,
    sponsorblock_remove: $("sponsorblock").checked ? ["sponsor", "selfpromo", "intro", "outro", "interaction"] : [],
    filters: {
      min_duration: $("min_duration").value, max_duration: $("max_duration").value,
      published_after: $("published_after").value,
      title_include: lines("title_include"), title_exclude: lines("title_exclude"),
      exclude_shorts: $("exclude_shorts").checked, exclude_live: $("exclude_live").checked,
    },
  };
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await res.json().catch(() => ({error: `HTTP ${res.status}`}));
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function loadState() {
  state = await api("/api/state");
  $("env").textContent = `yt-dlp ${state.yt_dlp} · ffmpeg ${state.ffmpeg ? "✓" : "✗ no encontrado (necesario)"} · datos en ${state.data_dir}`;
  if (state.feeds.length) {
    $("presetWrap").hidden = false;
    $("preset").innerHTML = '<option value="">—</option>' +
      state.feeds.map(f => `<option value="${esc(f.id)}">${esc(f.title || f.id)}</option>`).join("");
  }
}

function applyPreset(id) {
  const f = state.feeds.find(x => x.id === id);
  if (!f) return;
  feedIdTouched = true;
  $("source").value = f.source; $("feed_id").value = f.id; $("title").value = f.title || "";
  const fl = f.filters, dur = s => s == null ? "" : (s % 60 === 0 ? `${s / 60}m` : `${s}s`);
  $("min_duration").value = dur(fl.min_duration); $("max_duration").value = dur(fl.max_duration);
  $("published_after").value = fl.published_after || "";
  $("title_include").value = (fl.title_include || []).join("\n");
  $("title_exclude").value = (fl.title_exclude || []).join("\n");
  $("exclude_shorts").checked = fl.exclude_shorts; $("exclude_live").checked = fl.exclude_live;
  const radio = document.querySelector(`input[name=fmt][value="${f.audio_format}"]`);
  if (radio) radio.checked = true;
  $("sponsorblock").checked = (f.sponsorblock_remove || []).length > 0;
}

async function search() {
  const req = request();
  if (!req.source.trim()) return showMsg("searchMsg", "Escribe un canal o una lista de reproducción.");
  if (!$("feed_id").value) $("feed_id").value = req.feed_id;
  $("searchBtn").disabled = true; $("searchBtn").textContent = "Buscando…";
  showMsg("searchMsg", "");
  try {
    const data = await api("/api/search", req);
    videos = data.videos;
    selected = new Set(videos.filter(v => !v.reason && v.status !== "downloaded").map(v => v.id));
    const name = data.channel?.title || data.channel?.playlist_title || req.source;
    $("resultsTitle").textContent = name;
    if (!$("title").value && data.channel?.title) $("title").placeholder = data.channel.title;
    $("resultsSec").hidden = false; $("audioSec").hidden = false;
    renderVideos();
    $("resultsSec").scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) {
    showMsg("searchMsg", e.message);
  } finally {
    $("searchBtn").disabled = false; $("searchBtn").textContent = "Buscar vídeos";
  }
}

function renderVideos() {
  const pass = videos.filter(v => !v.reason);
  const show = $("showRejected").checked ? videos : pass;
  $("summary").textContent = `${pass.length} de ${videos.length} vídeos pasan los filtros · ${selected.size} seleccionados`;
  $("videos").innerHTML = show.length ? show.map(v => `
    <div class="video ${v.reason ? "rejected" : ""}">
      <input type="checkbox" data-id="${esc(v.id)}" ${selected.has(v.id) ? "checked" : ""}>
      <img loading="lazy" src="${esc(v.thumbnail || `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`)}" alt="">
      <div>
        <div class="t"><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></div>
        <div class="meta"><span>${esc(v.duration_str)}</span>${v.published ? `<span>${esc(v.published)}</span>` : ""}</div>
      </div>
      <div class="badges">
        ${v.status === "downloaded" ? '<span class="badge have">ya descargado</span> ' : ""}
        ${v.reason ? `<span class="badge no">${esc(reasonEs(v.reason))}</span>` : '<span class="badge ok">pasa</span>'}
      </div>
    </div>`).join("") : '<p class="empty">Ningún vídeo pasa los filtros. Marca “Mostrar descartados” para ver por qué.</p>';
  $("downloadBtn").disabled = selected.size === 0;
  $("downloadBtn").textContent = selected.size ? `Preparar audio (${selected.size})` : "Preparar audio";
}

async function startDownload() {
  const req = request();
  req.videos = videos.filter(v => selected.has(v.id)).map(v => ({id: v.id, title: v.title}));
  $("downloadBtn").disabled = true;
  try {
    await api("/api/download", req);
    selected.clear(); renderVideos();
    $("jobsSec").hidden = false;
    $("saveHint").textContent = `Así “yt2pod run” descargará automáticamente los nuevos vídeos de ${req.source} que pasen estos filtros.`;
    $("jobsSec").scrollIntoView({behavior: "smooth", block: "start"});
    poll();
  } catch (e) {
    showMsg("searchMsg", e.message);
    $("downloadBtn").disabled = false;
  }
}

const STATUS = {queued: "en cola", fetching: "leyendo vídeo…", downloading: "descargando", processing: "procesando audio…",
                done: "listo", error: "error"};
const CODEC = {opus: "Opus", aac: "AAC", mp3: "MP3", vorbis: "Vorbis", flac: "FLAC"};

function quality(job) {
  const r = job.audio?.result || {}, src = job.audio?.source || {};
  if (!r.codec) return "";
  const parts = [`<b>${esc(CODEC[r.codec] || r.codec)}</b>`];
  if (r.kbps) parts.push(`<b>${r.kbps} kbps</b>`);
  if (r.sample_rate) parts.push(`${(r.sample_rate / 1000).toFixed(1).replace(".0", "")} kHz`);
  if (r.channels) parts.push(r.channels === 2 ? "estéreo" : r.channels === 1 ? "mono" : `${r.channels} canales`);
  if (job.audio.size) parts.push(`${(job.audio.size / 1048576).toFixed(1)} MB`);
  const srcCodec = (src.acodec || "").split(".")[0].replace("mp4a", "aac");
  const reencoded = job.format === "mp3" || (srcCodec && r.codec && srcCodec !== r.codec);
  let note = reencoded ? "recodificado" : "original de YouTube, sin recodificar";
  if (src.format_id) note += ` · formato ${esc(src.format_id)}${src.abr ? ` (${Math.round(src.abr)} kbps en origen)` : ""}`;
  return `${parts.join(" · ")} — ${note}`;
}

function renderJobs(jobs) {
  $("jobs").innerHTML = jobs.map(j => `
    <div class="job">
      <div class="head"><span class="t">${esc(j.title)}</span>
        <span class="badge ${j.status === "done" ? "ok" : j.status === "error" ? "no" : "have"}">${STATUS[j.status] || j.status}</span></div>
      ${["downloading", "processing", "fetching", "queued"].includes(j.status)
        ? `<div class="bar"><i style="width:${j.percent ?? (j.status === "queued" ? 0 : 5)}%"></i></div>` : ""}
      ${j.error ? `<div class="msg err">${esc(j.error)}</div>` : ""}
      ${j.status === "done" ? `<div class="quality">${quality(j)}</div>
        <audio controls preload="none" src="${esc(j.file)}"></audio>
        <div class="hint"><a href="${esc(j.file)}" download>Descargar archivo</a></div>` : ""}
    </div>`).join("");
  const done = jobs.find(j => j.feed_url);
  if (done) { $("feedBox").hidden = false; $("feedUrl").textContent = done.feed_url; }
}

async function poll() {
  clearTimeout(polling);
  const jobs = await api("/api/jobs").catch(() => []);
  renderJobs(jobs);
  if (jobs.some(j => !["done", "error"].includes(j.status))) polling = setTimeout(poll, 1000);
  else if (videos.length) {  // refresh "ya descargado" badges
    const done = new Set(jobs.filter(j => j.status === "done").map(j => j.video_id));
    videos.forEach(v => { if (done.has(v.id)) v.status = "downloaded"; });
    renderVideos();
  }
}

async function saveFeed() {
  try {
    const r = await api("/api/save-feed", request());
    showMsg("saveMsg", `${r.replaced ? "Actualizado" : "Añadido"} en ${r.path}. Ejecuta “yt2pod run” para vigilarlo.`, "ok");
    loadState();
  } catch (e) { showMsg("saveMsg", e.message); }
}

$("source").addEventListener("input", () => { if (!feedIdTouched) $("feed_id").value = suggestFeedId($("source").value); });
$("feed_id").addEventListener("input", () => { feedIdTouched = true; });
$("source").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
$("preset").addEventListener("change", e => applyPreset(e.target.value));
$("searchBtn").addEventListener("click", search);
$("showRejected").addEventListener("change", renderVideos);
$("selAll").addEventListener("click", () => { videos.filter(v => !v.reason).forEach(v => selected.add(v.id)); renderVideos(); });
$("selNone").addEventListener("click", () => { selected.clear(); renderVideos(); });
$("videos").addEventListener("change", e => {
  const id = e.target.dataset.id; if (!id) return;
  e.target.checked ? selected.add(id) : selected.delete(id); renderVideos();
});
$("downloadBtn").addEventListener("click", startDownload);
$("saveBtn").addEventListener("click", saveFeed);
loadState().then(() => api("/api/jobs")).then(jobs => { if (jobs.length) { $("jobsSec").hidden = false; renderJobs(jobs); poll(); } })
  .catch(e => { $("env").textContent = e.message; });
</script>
</body>
</html>
