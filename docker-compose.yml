services:
  yt2pod:
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
      # - ./cookies.txt:/cookies.txt:ro   # only if YouTube blocks your server (see README)
    environment:
      YT2POD_CHECK_INTERVAL: 30m
      YT2POD_AUDIO_FORMAT: m4a
      # YT2POD_BASE_URL: https://yt2pod.tu-tailnet.ts.net   # public URL for the RSS feeds
      # YT2POD_COOKIES_FILE: /cookies.txt
      # YT2POD_SPONSORBLOCK: sponsor,selfpromo
